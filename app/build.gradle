plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.fen.tsbot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fen.tsbot'
        minSdk 26
        targetSdk 35
        versionCode 146
        versionName 'v146'

        python {
            version '3.8'
        }
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            // Cac APK da phat hanh truoc day dung Android Debug certificate. Giu cung key de
            // Android cho phep cap nhat de len ban cu ma khong phai go app/mat cau hinh.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
